name: Release Prod

permissions:
  contents: read

on:
  push:
    tags:
      - "release-*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  trigger-vercel-deployment:
    if: ${{ github.repository_owner == 'recallnet' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3 # Note: matches exact version from root `package.json`

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Build active apps and packages
        run: PRIVATE_FONTS=true FONTS_REPO_ACCESS_TOKEN=${{ secrets.FONTS_REPO_ACCESS_TOKEN }} pnpm build --filter='!api'

      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Run production database migrations
        timeout-minutes: 15
        run: pnpm --filter api db:migrate:vercel ../../.vercel/.env.production.local

      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
